<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勿扰修仙中 · 综合工具</title>
<style>
  :root{
    --line:#e2e8f0;
    --muted:#64748b;
    --accent:#6366f1;
    --gold:#f59e0b;
    --green:#10b981;
    --red:#ef4444;
    --bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:28px 16px 70px;
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);color:#0f172a;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1100px;margin:0 auto}

  .window-tabs{
    display:flex;
    gap:4px;
    background:#e2e8f0;
    padding:6px 6px 0;
    border-radius:12px 12px 0 0;
    margin-bottom:0;
    border:1px solid var(--line);
    border-bottom:none;
  }
  .window-tab{
    padding:10px 22px;
    font-size:13px;
    font-weight:600;
    color:#64748b;
    background:transparent;
    border:none;
    border-radius:8px 8px 0 0;
    cursor:pointer;
    transition:.15s;
    font-family:inherit;
  }
  .window-tab:hover{color:#334155;background:#f1f5f9}
  .window-tab.active{
    background:#fff;
    color:#0f172a;
    box-shadow:0 -1px 3px rgba(15,23,42,.06);
  }
  .window-body{
    background:#fff;
    border:1px solid var(--line);
    border-radius:0 0 14px 14px;
    padding:20px 20px 28px;
    box-shadow:0 1px 3px rgba(15,23,42,.05);
  }
  .panel{display:none}
  .panel.active{display:block}

  h1{font-size:22px;margin:0 0 6px;font-weight:700}
  .sub{margin:0 0 22px;color:var(--muted);font-size:13px}

  .layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:16px;
  }
  .card:last-child{margin-bottom:0}
  .card h2{margin:0 0 12px;font-size:14px;font-weight:600;color:#475569;letter-spacing:.02em}

  input[type=number], input[type=text]{
    font:inherit;color:inherit;border:1px solid #cbd5e1;background:#fff;
    border-radius:8px;padding:6px 8px;outline:none;transition:.15s;
  }
  input[type=number]{width:66px;text-align:center}
  input[type=number]:focus, input[type=text]:focus{
    border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15);
  }
  input[type=number]:disabled{background:#f1f5f9;color:#94a3b8;cursor:not-allowed}

  .lbl{font-size:13px;color:var(--muted);white-space:nowrap}

  button{font:inherit;cursor:pointer;border-radius:8px;transition:.15s;border:1px solid transparent}
  .btn{background:var(--accent);color:#fff;border:none;padding:8px 14px;font-size:13px;font-weight:500}
  .btn:hover{background:#4f46e5}
  .btn.ghost{background:#fff;border:1px solid #cbd5e1;color:#475569}
  .btn.ghost:hover{background:#f8fafc;border-color:#94a3b8}
  .btn.small{padding:5px 10px;font-size:12px}

  .star{
    background:transparent;border:none;font-size:15px;line-height:1;
    padding:2px 4px;border-radius:6px;cursor:pointer;color:#cbd5e1;
    transition:.15s;flex:none;
  }
  .star:hover{background:#fef3c7;color:var(--gold)}
  .star.on{color:var(--gold)}

  .target-row{
    display:flex;align-items:center;gap:8px;padding:7px 9px;
    border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#f8fafc;
  }
  .target-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex:none}
  .target-row .t-name{flex:1;font-weight:600;cursor:pointer;user-select:none;font-size:14px}
  .target-row .t-name .tier{color:#94a3b8;font-weight:400;font-size:11px;margin-left:6px}

  .fav-box{
    border:1px solid #fcd34d;background:#fffbeb;border-radius:12px;
    padding:10px 10px 6px;margin-bottom:14px;
  }
  .fav-title{
    font-size:12px;font-weight:700;color:#b45309;letter-spacing:.06em;
    margin:0 0 8px;display:flex;align-items:center;gap:6px;
  }
  .fav-title::before{content:'★';font-size:13px;color:var(--gold)}
  .fav-empty{font-size:12px;color:#a16207;opacity:.7;margin:0 0 6px 4px}
  .fav-box .target-row{background:#fff;border-color:#fde68a}

  .cat{margin-bottom:8px}
  .cat-head{
    display:flex;align-items:center;gap:6px;cursor:pointer;
    padding:8px 10px;background:#f8fafc;border:1px solid var(--line);
    border-radius:10px;font-weight:600;font-size:13px;color:#334155;
    user-select:none;
  }
  .cat-head:hover{background:#f1f5f9}
  .cat-head .arrow{font-size:10px;color:var(--muted);transition:.2s;display:inline-block}
  .cat-head.open .arrow{transform:rotate(90deg)}
  .cat-head .count{font-weight:400;color:#94a3b8;font-size:12px;margin-left:auto}
  .cat-body{padding:8px 0 0 0;display:none}
  .cat-head.open + .cat-body{display:block}

  .tier-label{font-size:12px;color:#94a3b8;margin:6px 0 4px 4px}

  .res-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:14px 0 6px}
  .res-title:first-child{margin-top:0}
  .res-table{width:100%;border-collapse:collapse;font-size:14px}
  .res-table th{
    text-align:left;font-weight:600;color:var(--muted);font-size:12px;
    padding:6px 8px;border-bottom:1px solid var(--line);
  }
  .res-table td{padding:8px;border-bottom:1px solid #f1f5f9}
  .res-table tr:last-child td{border-bottom:none}
  .res-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .res-table td:first-child{font-weight:500}

  .total-bar{
    background:linear-gradient(135deg,#eef2ff,#e0e7ff);
    border:1px solid #c7d2fe;border-radius:12px;
    padding:14px 16px;margin-top:14px;
  }
  .total-bar .sentence{font-size:14px;color:#3730a3;line-height:1.6;margin-bottom:8px}
  .total-bar .sentence b{color:#4338ca}
  .total-bar .amount{
    display:flex;align-items:baseline;
    border-top:1px dashed #c7d2fe;padding-top:8px;
  }
  .total-bar .amount .label{font-size:13px;font-weight:600;color:#4338ca}
  .total-bar .amount .value{
    font-size:22px;font-weight:800;color:#4338ca;
    font-variant-numeric:tabular-nums;margin-left:auto;
  }
  .total-bar .amount .value small{font-size:13px;font-weight:500;margin-left:2px}

  .empty{color:#94a3b8;font-size:13px;margin:4px 0}
  .warn{
    background:#fef2f2;border:1px solid #fecaca;color:#b91c1c;
    padding:8px 10px;border-radius:8px;font-size:13px;margin-bottom:12px;
  }
  .opt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:-4px 0 10px;cursor:pointer}
  .opt input{accent-color:var(--accent);cursor:pointer}
  .head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .head-row h2{margin:0}

  .char-card{
    border:1px solid var(--line);border-radius:12px;padding:14px;
    margin-bottom:12px;background:#fafbff;position:relative;
  }
  .char-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .char-name{
    font:inherit;font-weight:600;color:#0f172a;border:1px solid #cbd5e1;
    background:#fff;border-radius:8px;padding:4px 8px;outline:none;width:140px;
    transition:.15s;font-size:14px;
  }
  .char-name:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
  .char-del{
    margin-left:auto;background:transparent;border:none;
    color:#94a3b8;font-size:18px;line-height:1;cursor:pointer;
    padding:2px 6px;border-radius:6px;transition:.15s;
  }
  .char-del:hover{background:#fef2f2;color:var(--red)}

  .field-row{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
    font-size:13px;color:#475569;margin-bottom:10px;
  }
  .field-row label{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .field-row input[type=number]{width:120px}

  .pill{
    display:inline-block;padding:2px 10px;border-radius:999px;
    font-size:11px;font-weight:600;letter-spacing:.02em;
  }
  .pill.stage{background:#eef2ff;color:#4338ca}

  .result-box{
    margin-top:10px;padding:12px;border-radius:10px;background:#fff;
    border:1px solid #e2e8f0;
  }
  .result-title{
    font-size:12px;font-weight:700;color:#64748b;letter-spacing:.05em;
    margin:0 0 8px;display:flex;align-items:center;gap:6px;
  }
  .result-title::before{content:'◆';font-size:9px;color:var(--accent)}
  .result-table{width:100%;border-collapse:collapse;font-size:13px}
  .result-table th{
    text-align:left;font-weight:600;color:var(--muted);font-size:11px;
    padding:4px 6px;border-bottom:1px solid #f1f5f9;
  }
  .result-table td{padding:6px;border-bottom:1px solid #f8fafc}
  .result-table tr:last-child td{border-bottom:none}
  .result-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .result-table .name{font-weight:500}

  .plan-tag{
    display:inline-block;font-size:11px;font-weight:700;
    padding:2px 8px;border-radius:6px;margin-right:6px;
  }
  .plan-tag.a{background:#dbeafe;color:#1d4ed8}
  .plan-tag.b{background:#fce7f3;color:#be185d}
  .plan-tag.c{background:#e0e7ff;color:#4338ca}

  .add-btn{
    display:flex;align-items:center;justify-content:center;gap:6px;
    width:100%;padding:10px;border:2px dashed #cbd5e1;border-radius:12px;
    background:#f8fafc;color:#64748b;font-size:13px;font-weight:600;
    cursor:pointer;transition:.15s;font-family:inherit;
  }
  .add-btn:hover{border-color:var(--accent);color:var(--accent);background:#eef2ff}
</style>
</head>
<body>
<div class="wrap">

  <div class="window-tabs">
    <button class="window-tab active" id="tabSynth" onclick="switchTab('synth')">材料计算器</button>
    <button class="window-tab" id="tabDisciple" onclick="switchTab('disciple')">徒弟修为计算器</button>
  </div>

  <div class="window-body">

    <!-- ==================== 面板1：材料计算器 ==================== -->
    <div class="panel active" id="panelSynth">
      <h1>勿扰修仙中 · 合成材料计算器</h1>
      <p class="sub">勾选要合成的物品并填写数量，自动汇总基础材料与灵石总价。</p>

      <div class="layout">
        <section class="card">
          <h2>① 可勾选合成</h2>
          <div id="targetList"></div>
        </section>

        <div>
          <section class="card">
            <div class="head-row">
              <h2>② 材料汇总</h2>
              <button id="copyBtn" class="btn ghost small">复制结果</button>
            </div>
            <label class="opt"><input type="checkbox" id="ceilMode"> 按整数次合成（每次合成次数向上取整）</label>
            <div id="result"></div>
          </section>
        </div>
      </div>
    </div>

    <!-- ==================== 面板2：徒弟修为计算器 ==================== -->
    <div class="panel" id="panelDisciple">
      <h1>勿扰修仙中 · 徒弟修为计算器</h1>
      <p class="sub">输入徒弟修为与突破概率，自动识别境界并计算所需丹药组合。</p>

      <section class="card">
        <h2>徒弟列表</h2>
        <div id="discipleList"></div>
        <button class="add-btn" id="addDiscipleBtn">＋ 添加徒弟</button>
      </section>
    </div>

  </div>

</div>

/* ============================================================
   材料计算器逻辑
   ============================================================ */
let uid = 1;
const recipes = RECIPE_DATA.map(r => ({
  id: uid++,
  name: r.name,
  tier: r.tier,
  cat: r.cat,
  output: 1,
  ingredients: r.ingredients.map(i => ({ name: i.name, qty: i.qty }))
}));

const favorites = new Set();
try{
  const saved = localStorage.getItem('wx_favs');
  if (saved) JSON.parse(saved).forEach(n => favorites.add(n));
}catch(e){}

const targets = {};
function ensureTargets(){
  recipes.forEach(r => { if (!targets[r.id]) targets[r.id] = { checked:false, qty:1 }; });
  Object.keys(targets).forEach(id => {
    if (!recipes.some(r => r.id === Number(id))) delete targets[id];
  });
}
ensureTargets();

const targetListEl = document.getElementById('targetList');
const resultEl     = document.getElementById('result');
const ceilEl       = document.getElementById('ceilMode');
let lastResultText = '';

function fmt(n){
  if (!isFinite(n)) return '0';
  const r = Math.round(n * 1000) / 1000;
  if (Number.isInteger(r)) return String(r);
  return r.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function saveFavs(){
  try{ localStorage.setItem('wx_favs', JSON.stringify([...favorites])); }catch(e){}
}

function buildTargetRow(r){
  const t = targets[r.id];
  const row = document.createElement('div');
  row.className = 'target-row';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.id = 'cb_' + r.id;
  cb.checked = t.checked;

  const label = document.createElement('label');
  label.className = 't-name';
  label.htmlFor = cb.id;
  label.innerHTML = escapeHtml(r.name) +
    ' <span class="tier">' + escapeHtml(r.tier || '') + '</span>';

  const qIn = document.createElement('input');
  qIn.type = 'number';
  qIn.min = '1';
  qIn.step = '1';
  qIn.value = t.qty;
  qIn.disabled = !t.checked;

  const star = document.createElement('button');
  star.className = 'star' + (favorites.has(r.name) ? ' on' : '');
  star.textContent = favorites.has(r.name) ? '★' : '☆';
  star.title = '收藏';
  star.addEventListener('click', (e) => {
    e.preventDefault();
    if (favorites.has(r.name)) favorites.delete(r.name);
    else favorites.add(r.name);
    saveFavs();
    renderTargets();
  });

  cb.addEventListener('change', () => {
    t.checked = cb.checked;
    qIn.disabled = !cb.checked;
    if (cb.checked && !(Number(qIn.value) > 0)) { qIn.value = 1; t.qty = 1; }
    update();
  });
  qIn.addEventListener('input', () => {
    const v = Number(qIn.value);
    t.qty = v > 0 ? v : 0;
    update();
  });

  const unit = document.createElement('span');
  unit.className = 'lbl';
  unit.textContent = '个';

  row.append(cb, label, qIn, unit, star);

}

function renderTargets(){

      body.appendChild(tLabel);
      sub.forEach(r => body.appendChild(buildTargetRow(r)));

      head.classList.toggle('open');
    });

    box.appendChild(head);
    box.appendChild(body);

function update(){
  const ceil = ceilEl.checked;

  const byName = new Map();
  recipes.forEach(r => {
    const n = r.name.trim();
    if (n && !byName.has(n)) byName.set(n, r);
  });

  const base  = new Map();
  const errors = [];
  const chosen = [];

  function rec(name, qty, path){
    const r = byName.get(name);
    if (!r || r.ingredients.length === 0){
      base.set(name, (base.get(name) || 0) + qty);
      return;
    }
    if (path.includes(name)){
      errors.push('循环依赖：' + path.concat(name).join(' → '));
      return;
    }

    let times = qty / (r.output > 0 ? r.output : 1);
    if (ceil) times = Math.ceil(times - 1e-9);

    const p = path.concat(name);
    r.ingredients.forEach(ing => {
      const n = (ing.name || '').trim();
      const q = Number(ing.qty);
      if (!n || !(q > 0)) return;
      rec(n, q * times, p);
    });
  }

  let hasTarget = false;
  recipes.forEach(r => {
    const t = targets[r.id];
    if (!t || !t.checked) return;
    const name = r.name.trim();
    if (!name) return;
    const qty = Number(t.qty);
    if (!(qty > 0)) return;
    hasTarget = true;
    chosen.push({ name, qty });
    rec(name, qty, []);
  });

  if (!hasTarget){
    resultEl.innerHTML = '<p class="empty">勾选物品并填写数量后，这里会显示所需材料。</p>';
    lastResultText = '';
    return;
  }

  let html = '';
  let textLines = [];
  let total = 0;

  if (errors.length){
    html += '<div class="warn">' + errors.map(escapeHtml).join('<br>') + '</div>';
  }

  const baseEntries = [...base.entries()].filter(([, q]) => q > 0);
  if (baseEntries.length){
    html += '<div class="res-title">基础材料汇总</div>';
    html += '<table class="res-table"><thead><tr><th>材料</th><th class="num">数量</th><th class="num">单价</th><th class="num">小计</th></tr></thead><tbody>';
    baseEntries.sort((a,b) => a[0].localeCompare(b[0], 'zh'));
    baseEntries.forEach(([n, q]) => {
      const price = MATERIAL_PRICE[n] || 0;
      const subtotal = price * q;
      total += subtotal;
      html += '<tr><td>' + escapeHtml(n) + '</td>' +
              '<td class="num">' + fmt(q) + '</td>' +
              '<td class="num">' + (price > 0 ? fmt(price) : '—') + '</td>' +
              '<td class="num">' + (price > 0 ? fmt(subtotal) : '—') + '</td></tr>';
      textLines.push(n + ' × ' + fmt(q) + (price > 0 ? '  (' + fmt(subtotal) + ' 灵石)' : ''));
    });
    html += '</tbody></table>';

    const targetSentence = chosen
      .map(c => '<b>' + fmt(c.qty) + '</b> 个 ' + escapeHtml(c.name))
      .join(' + ');

    html += '<div class="total-bar">' +
            '<div class="sentence">' + targetSentence + '</div>' +
            '<div class="amount">' +
              '<span class="label">合计</span>' +
              '<span class="value">' + fmt(total) + '<small> 灵石</small></span>' +
            '</div>' +
            '</div>';

    textLines.push(chosen.map(c => fmt(c.qty) + ' 个 ' + c.name).join(' + ') + ' → 合计 ' + fmt(total) + ' 灵石');
  } else {
    html += '<p class="empty">没有需要的基础材料</p>';
  }

  resultEl.innerHTML = html;
  lastResultText = textLines.join('\n');
}

ceilEl.addEventListener('change', update);

document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!lastResultText) return;
  try{
    await navigator.clipboard.writeText(lastResultText);
    const b = document.getElementById('copyBtn');
    const old = b.textContent;
    b.textContent = '已复制';
    setTimeout(() => b.textContent = old, 1200);
  }catch(e){
    alert('复制失败，请手动选择结果文本');
  }
});

/* ============================================================
   徒弟修为计算器数据
   ============================================================ */
const STAGES = [
  { name:'炼气',    max:2500,  battle:5000   },
  { name:'筑基',    max:9000,  battle:18000  },
  { name:'金丹',    max:28000, battle:56000  },
  { name:'元婴',    max:62000, battle:124000 },
  { name:'化神',    max:100000,battle:200000 },
  { name:'大乘',    max:Infinity, battle:Infinity }
];

const STAGE_BREAK_PILL = {
  '炼气': { name:'筑基丹',  bonus:5,  cultivation:20 },
  '筑基': { name:'降尘丹',  bonus:5,  cultivation:40 },
  '金丹': { name:'化婴丹',  bonus:5,  cultivation:60 },
  '元婴': { name:'化神丹',  bonus:5,  cultivation:100 },
  '化神': { name:'大乘灵丹',bonus:5,  cultivation:150 },
  '大乘': null
};

const JU_LING_DAN = { name:'聚灵丹', cultivation:30 };

function identifyStage(cultivation){
  if (cultivation < 0) cultivation = 0;
  for (let i = 0; i < STAGES.length; i++){
    if (cultivation < STAGES[i].max) return STAGES[i].name;
  }
  return STAGES[STAGES.length-1].name;
}

function calculatePlans(cultivation, breakChance){
  const stage = identifyStage(cultivation);
  const stageIndex = STAGES.findIndex(s => s.name === stage);
  const breakPill = STAGE_BREAK_PILL[stage];

  const stageData = STAGES[stageIndex];
  const targetCultivation = stageData.max === Infinity ? cultivation : stageData.max;
  const neededCultivation = Math.max(0, targetCultivation - cultivation);
  const chanceGap = Math.max(0, 100 - breakChance);

  const plans = [];

  // 方案1：只用聚灵丹（非化神/大乘）
  if (stage !== '化神' && stage !== '大乘'){
    const juLingCount = Math.ceil(neededCultivation / JU_LING_DAN.cultivation);
    plans.push({
      type: 'A',
      label: '只用聚灵丹',
      pills: [{ name:'聚灵丹', count: juLingCount, cultivation: JU_LING_DAN.cultivation }],
      totalCult: juLingCount * JU_LING_DAN.cultivation,
      finalCult: cultivation + juLingCount * JU_LING_DAN.cultivation,
      breakChanceAfter: breakChance
    });
  }

  // 方案2：只用突破丹
  if (breakPill){
    let breakPillForCult = Math.ceil(neededCultivation / breakPill.cultivation);
    let breakPillForChance = Math.ceil(chanceGap / breakPill.bonus);
    let breakPillCount = Math.max(breakPillForCult, breakPillForChance);
    if (neededCultivation <= 0){
      breakPillCount = breakPillForChance;
    }
    breakPillCount = Math.max(0, breakPillCount);
    plans.push({
      type: 'B',
      label: '只用' + breakPill.name,
      pills: [{ name: breakPill.name, count: breakPillCount, cultivation: breakPill.cultivation }],
      totalCult: breakPillCount * breakPill.cultivation,
      finalCult: cultivation + breakPillCount * breakPill.cultivation,
      breakChanceAfter: breakChance + breakPillCount * breakPill.bonus
    });
  }

  // 方案3：突破丹+聚灵丹混用
  if (breakPill && stage !== '化神' && stage !== '大乘'){
    let breakPillCount = Math.ceil(chanceGap / breakPill.bonus);
    breakPillCount = Math.max(0, breakPillCount);
    let cultFromBreakPill = breakPillCount * breakPill.cultivation;
    let remainingCult = Math.max(0, neededCultivation - cultFromBreakPill);
    let juLingCount = Math.ceil(remainingCult / JU_LING_DAN.cultivation);

    const pillsList = [];
    if (breakPillCount > 0){
      pillsList.push({ name: breakPill.name, count: breakPillCount, cultivation: breakPill.cultivation });
    }
    if (juLingCount > 0){
      pillsList.push({ name:'聚灵丹', count: juLingCount, cultivation: JU_LING_DAN.cultivation });
    }
    if (pillsList.length === 0){
      pillsList.push({ name:'无需丹药', count: 0, cultivation: 0 });
    }

    plans.push({
      type: 'C',
      label: '突破丹+聚灵丹混用',
      pills: pillsList,
      totalCult: cultFromBreakPill + juLingCount * JU_LING_DAN.cultivation,
      finalCult: cultivation + cultFromBreakPill + juLingCount * JU_LING_DAN.cultivation,
      breakChanceAfter: breakChance + breakPillCount * breakPill.bonus
    });
  }

  // 大乘期特殊处理
  if (stage === '大乘' && !breakPill){
    const juLingCount = Math.ceil(neededCultivation / JU_LING_DAN.cultivation);
    plans.push({
      type: 'A',
      label: '只用聚灵丹（大乘期）',
      pills: [{ name:'聚灵丹', count: juLingCount, cultivation: JU_LING_DAN.cultivation }],
      totalCult: juLingCount * JU_LING_DAN.cultivation,
      finalCult: cultivation + juLingCount * JU_LING_DAN.cultivation,
      breakChanceAfter: breakChance
    });
  }

  return { stage, plans };
}

let discipleUid = 1;
const disciples = [];

function createDisciple(name){

    id: discipleUid++,

function buildDiscipleCard(c){

  card.className = 'char-card';

  const head = document.createElement('div');
  head.className = 'char-head';

  const nameInput = document.createElement('input');
  nameInput.className = 'char-name';
  nameInput.type = 'text';
  nameInput.value = c.name;

  nameInput.addEventListener('input', () => { c.name = nameInput.value; });

  const delBtn = document.createElement('button');
  delBtn.className = 'char-del';
  delBtn.textContent = '✕';
  delBtn.title = '删除此徒弟';
  delBtn.addEventListener('click', () => {
    const idx = disciples.findIndex(x => x.id === c.id);
    if (idx > -1) disciples.splice(idx, 1);
    renderDiscipleList();
  });

  head.append(nameInput, delBtn);

  const fieldRow = document.createElement('div');
  fieldRow.className = 'field-row';

  const cultLabel = document.createElement('label');
  cultLabel.innerHTML = '修为：';
  const cultInput = document.createElement('input');
  cultInput.type = 'number';
  cultInput.min = '0';
  cultInput.step = '1';
  cultInput.value = c.cultivation !== null ? c.cultivation : '';
  cultInput.placeholder = '请输入数字';

  const chanceLabel = document.createElement('label');
  chanceLabel.innerHTML = '突破概率：';
  const chanceInput = document.createElement('input');
  chanceInput.type = 'number';
  chanceInput.min = '0';
  chanceInput.max = '1000';
  chanceInput.step = '1';
  chanceInput.value = c.breakChance !== null ? c.breakChance : '';
  chanceInput.placeholder = '请输入数字';

  const stagePill = document.createElement('span');
  stagePill.className = 'pill stage';
  const updateStagePill = () => {
    if (c.cultivation === null){
      stagePill.textContent = '当前：-';
    } else {
      stagePill.textContent = '当前：' + identifyStage(c.cultivation);
    }
  };
  updateStagePill();

  const updateCalc = () => {
    const cultRaw = cultInput.value.trim();
    const chanceRaw = chanceInput.value.trim();
    c.cultivation = cultRaw === '' ? null : Number(cultRaw);
    c.breakChance = chanceRaw === '' ? null : Number(chanceRaw);
    updateStagePill();
    renderDiscipleResult(c, resultBox);
  };

  cultInput.addEventListener('input', updateCalc);
  chanceInput.addEventListener('input', updateCalc);

  cultLabel.appendChild(cultInput);
  chanceLabel.appendChild(chanceInput);
  fieldRow.append(cultLabel, chanceLabel, stagePill);

  const resultBox = document.createElement('div');
  resultBox.className = 'result-box';

  setTimeout(() => renderDiscipleResult(c, resultBox), 0);

  card.append(head, fieldRow, resultBox);
  return card;
}

function renderDiscipleResult(c, container){
  const hasCult = c.cultivation !== null && c.cultivation !== undefined && !isNaN(c.cultivation);
  const hasChance = c.breakChance !== null && c.breakChance !== undefined && !isNaN(c.breakChance);

  // 只要有任何一项未输入，就显示默认空方案
  if (!hasCult || !hasChance){
    container.innerHTML = buildEmptyResultHtml();
    return;
  }

  if (c.cultivation < 0){
    container.innerHTML = '<p class="empty">修为不能为负数</p>';
    return;
  }
  if (c.breakChance < 0){
    container.innerHTML = '<p class="empty">突破概率不能为负数</p>';
    return;
  }

  const result = calculatePlans(c.cultivation, c.breakChance);
  const { stage, plans } = result;

  let html = '';

  if (stage === '化神' || stage === '大乘'){
    html += '<div style="font-size:12px;color:#b45309;background:#fffbeb;padding:6px 8px;border-radius:6px;margin-bottom:8px;border:1px solid #fde68a">' +
      stage + '期仅可使用' + (STAGE_BREAK_PILL[stage] ? STAGE_BREAK_PILL[stage].name : '聚灵丹') + '</div>';
  }

  plans.forEach(plan => {
    const tagClass = plan.type.toLowerCase();
    const tagLabel = plan.type === 'A' ? '聚灵' : (plan.type === 'B' ? '突破丹' : '混合');

    html += '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed #e2e8f0">';

    html += '<div class="result-title" style="margin-bottom:6px">' +
      '<span class="plan-tag ' + tagClass + '">' + tagLabel + '</span>' +
      '</div>';

    html += '<table class="result-table"><thead><tr>' +
      '<th>丹药</th><th class="num">数量</th><th class="num">提供修为</th>' +
      '</tr></thead><tbody>';

    plan.pills.forEach(p => {
      if (p.name === '无需丹药'){
        html += '<tr>' +
          '<td class="name">' + escapeHtml(p.name) + '</td>' +
          '<td class="num">-</td>' +
          '<td class="num">-</td>' +
          '</tr>';
      } else {
        html += '<tr>' +
          '<td class="name">' + escapeHtml(p.name) + '</td>' +
          '<td class="num">' + fmt(p.count) + '</td>' +
          '<td class="num">' + fmt(p.count * p.cultivation) + '</td>' +
          '</tr>';
      }
    });

    html += '</tbody></table>';

    const chanceColor = plan.breakChanceAfter >= 100 ? '#10b981' : '#f59e0b';

    html += '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px">' +
      '<span>总修为：<b>' + fmt(plan.finalCult) + '</b>' +
        '<span style="color:#94a3b8;font-size:11px;margin-left:4px">（当前 ' + fmt(c.cultivation) + ' + 丹药 ' + fmt(plan.totalCult) + '）</span>' +
      '</span>' +
      '<span>突破概率：<b style="color:' + chanceColor + '">' +
        fmt(plan.breakChanceAfter) + '%</b>' +
        (plan.breakChanceAfter > 100 ? ' <span style="color:#10b981;font-size:11px">(溢出)</span>' : '') +
      '</span>' +
      '</div>';

    html += '</div>';
  });

  container.innerHTML = html;
}

/* 未输入数字时的默认结果（全部用 - 表示） */
function buildEmptyResultHtml(){
  function emptyPlan(tagClass, tagLabel, pillNames){
    let html = '<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px dashed #e2e8f0">';
    html += '<div class="result-title" style="margin-bottom:6px">' +
      '<span class="plan-tag ' + tagClass + '">' + tagLabel + '</span>' +
      '</div>';
    html += '<table class="result-table"><thead><tr>' +
      '<th>丹药</th><th class="num">数量</th><th class="num">提供修为</th>' +
      '</tr></thead><tbody>';
    pillNames.forEach(n => {
      html += '<tr><td class="name">' + n + '</td><td class="num">-</td><td class="num">-</td></tr>';
    });
    html += '</tbody></table>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;font-size:12px">' +
      '<span>总修为：<b>-</b></span>' +
      '<span>突破概率：<b>-</b></span>' +
      '</div>';
    html += '</div>';
    return html;
  }

  let html = '';
  html += emptyPlan('a', '聚灵', ['聚灵丹']);
  html += emptyPlan('b', '突破丹', ['筑基丹']);
  html += emptyPlan('c', '混合', ['筑基丹', '聚灵丹']);
  return html;
}

function renderDiscipleList(){
  const list = document.getElementById('discipleList');
  list.innerHTML = '';
  if (disciples.length === 0){
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.style.textAlign = 'center';
    empty.style.padding = '16px';
    empty.textContent = '暂无徒弟，点击下方按钮添加';
    list.appendChild(empty);
  } else {
    disciples.forEach(c => list.appendChild(buildDiscipleCard(c)));
  }
}

/* ============================================================
   事件绑定
   ============================================================ */
document.getElementById('addDiscipleBtn').addEventListener('click', () => {
  const c = createDisciple();
  c.name = '徒弟' + (disciples.length + 1);
  disciples.push(c);
  renderDiscipleList();
  setTimeout(() => {
    const cards = document.querySelectorAll('#discipleList .char-card');
    if (cards.length) cards[cards.length-1].scrollIntoView({ behavior:'smooth', block:'center' });
  }, 50);
});

/* 窗口切换 */
function switchTab(tab){
  document.querySelectorAll('.window-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));

  if (tab === 'synth'){
    document.getElementById('tabSynth').classList.add('active');
    document.getElementById('panelSynth').classList.add('active');
  } else {
    document.getElementById('tabDisciple').classList.add('active');
    document.getElementById('panelDisciple').classList.add('active');
  }
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  renderTargets();
  update();

  // 默认只有一个徒弟
  const c1 = createDisciple('徒弟1');
  disciples.push(c1);

  renderDiscipleList();
}

init();

</script>
</body>
